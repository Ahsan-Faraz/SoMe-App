# Installed as /etc/nginx/snippets/wp-theirl-net.conf; included by the theirl.net server block.
# WordPress (deploy/vps/wordpress-setup.sh) answers only these paths: the public pages (/, /pricing,
# /about, /contact, /cookies, client guide 261123) and its own folders. Everything else, every
# community among it, stays with the app (nginx-some-app.conf). These paths are reserved community
# addresses (private.reserved_slug), so no community can take them.
#
# Every location here is exact (=), ^~ or an anchored list of page names, so the app's requests
# never go through these rules, and nothing in WordPress's folder is reachable except through them.

root /srv/wp/theirl.net/public;
index index.php;

# Never reachable from the web: no XML-RPC (password guessing), no install screens (WordPress is
# installed from the command line), scheduled jobs run from a systemd timer.
location = /xmlrpc.php { return 403; }
location = /wp-admin/install.php { return 403; }
location = /wp-admin/setup-config.php { return 403; }
location = /wp-cron.php { return 403; }

# The front controller: wp-json is routed through it.
location = /index.php {
    include snippets/wp-common.conf;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/theirl-net.sock;
}

# The public pages, cached for visitors (nginx-wp-page.conf). WordPress adds the trailing slash
# (/about -> /about/) and sends /home/ to /. robots.txt and the sitemap are WordPress's own.
location = / {
    include snippets/wp-common.conf;
    include snippets/wp-page.conf;
    fastcgi_pass unix:/run/php/theirl-net.sock;
}
location ~ ^/(?:home|pricing|about|contact|cookies)/?$ {
    include snippets/wp-common.conf;
    include snippets/wp-page.conf;
    fastcgi_pass unix:/run/php/theirl-net.sock;
}
location ~ ^/(?:robots\.txt|wp-sitemap[a-z0-9-]*\.xml)$ {
    include snippets/wp-common.conf;
    include snippets/wp-page.conf;
    fastcgi_pass unix:/run/php/theirl-net.sock;
}
# The menu's "Get started" button opens the app's sign-up.
location = /get-started { return 302 /join; }

# Password guessing is slowed down: 6 tries a minute per address, a burst of 5.
location = /wp-login.php {
    include snippets/wp-common.conf;
    limit_req zone=wp_login burst=5 nodelay;
    limit_req_status 429;
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/theirl-net.sock;
}

location = /wp-admin { return 301 /wp-admin/; }
location ^~ /wp-admin/ {
    include snippets/wp-common.conf;
    # The site import uploads in chunks of a few MB; this leaves room above the server's 10 MB.
    client_max_body_size 64m;
    location ~ /\. { return 403; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/theirl-net.sock;
        fastcgi_read_timeout 300s;
    }
    try_files $uri $uri/ =404;
}

location ^~ /wp-json/ {
    include snippets/wp-common.conf;
    try_files $uri /index.php?$args;
}

# Static files only; none of its PHP files is meant to be opened directly.
location ^~ /wp-includes/ {
    include snippets/wp-common.conf;
    location ~ (/\.|\.php$) { return 403; }
    try_files $uri =404;
    expires 30d;
    access_log off;
}

# Themes, plugins and uploads: static files only. WordPress runs plugin and theme code through its
# own entry points (index.php, wp-admin/), so no PHP file in here is ever opened directly; blocking
# them closes the door most plugin exploits come through. Nor are dot-files, logs (debug.log), dumps,
# backups or the import's work files ever served.
location ^~ /wp-content/ {
    include snippets/wp-common.conf;
    location ~ ^/wp-content/(ai1wm-backups|plugins/all-in-one-wp-migration/storage)/ { return 403; }
    location ~* (/\.|\.(php|phtml|phar|log|sql|sqlite|gz|tar|bak|old|orig|swp|ini|conf|env|sh|wpress)$) { return 403; }
    try_files $uri =404;
    expires 30d;
    access_log off;
}
