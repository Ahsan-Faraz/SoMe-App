# Installed as /etc/nginx/snippets/wp-common.conf; included in each WordPress location of
# nginx-wp-<domain>.conf. Not at server level: the app sets its own headers (next.config.ts) and
# compresses its own responses, and compressing in nginx would hold back its streamed pages.
# Nested locations inherit all of this as long as they set none of it themselves.

# Headers. No framing headers (X-Frame-Options, frame-ancestors): WordPress sends its own on the
# login and admin pages; the public pages get theirs when they move over, with page caching.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Compression: WordPress's scripts and styles are large (the editor loads several MB of them);
# gzip makes them 4-5 times smaller. HTML is always included.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;
