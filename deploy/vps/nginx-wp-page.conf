# Installed as /etc/nginx/snippets/wp-page.conf; included in the public-page locations of
# nginx-wp-<domain>.conf (/, /about, ...), next to wp-common.conf and that site's fastcgi_pass.
# WordPress's front controller renders the page; nginx keeps a copy for visitors (the cache zone and
# the $wp_nocache rule are in nginx-some.conf), so most visits never reach PHP.

# The pages may be framed only by the site itself (WordPress sends this only on its admin pages).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
# HIT, MISS, BYPASS, EXPIRED, STALE: shows whether a page came from the cache.
add_header X-Cache $upstream_cache_status always;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME $document_root/index.php;
fastcgi_param SCRIPT_NAME /index.php;

fastcgi_cache wp_pages;
# Per domain: both sites' pages have the same paths.
fastcgi_cache_key "$scheme$host$request_uri";
# Editors see changes at once (logged in: no cache); visitors within 5 minutes.
fastcgi_cache_valid 200 301 302 5m;
fastcgi_cache_valid 404 1m;
fastcgi_cache_bypass $wp_nocache;
fastcgi_no_cache $wp_nocache;
# One request renders a missing page while others wait, and an old copy is served while a new one
# is made, or while PHP is down.
fastcgi_cache_lock on;
fastcgi_cache_background_update on;
fastcgi_cache_use_stale error timeout updating http_500 http_503;
