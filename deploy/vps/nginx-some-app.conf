# Installed as /etc/nginx/snippets/some-app.conf; included by every domain's server block in
# nginx-some.conf. Everything not claimed by a more specific location goes to the app.

server_tokens off;
# Images go straight to Supabase Storage; this only bounds form posts.
client_max_body_size 10m;

# Bots probe for .php files and dot-files (.env, .git) all day. The app has neither, so nginx answers
# a plain 404 at once instead of the app rendering its "not found" page. WordPress's own PHP files
# are matched first by its exact and ^~ locations (nginx-wp-*.conf), which win over these patterns.
location ~ \.php$ { return 404; }
location ~ /\.(?!well-known/) { return 404; }

# Hashed build files: served from disk by nginx, cached by browsers for a year.
location /_next/static/ {
    alias /srv/some/current/.next/static/;
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
}

location / {
    proxy_pass http://some_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwritten, never passed through: the rate limits (src/lib/rate-limit.ts) trust these.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Pages stream in with Suspense; buffering would hold back the first paint.
    proxy_buffering off;
    # The response headers still go through one buffer. Logging in sets the Supabase session
    # cookies (several KB), which overflow the 4 KB default: nginx then answers 502.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    proxy_read_timeout 60s;
}
