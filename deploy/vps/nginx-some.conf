# Installed as /etc/nginx/sites-available/some (linked from sites-enabled).
# Certbot adds the HTTPS (443) blocks and the http -> https redirect to the second server below.

# Kept-open connections to the app, so each request skips a TCP handshake.
upstream some_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Requests for the bare IP or any other host name get no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Both prod domains go to the one app; the app tells them apart by the Host header.
server {
    listen 80;
    listen [::]:80;
    server_name theirl.net www.theirl.net aiproduktion.se www.aiproduktion.se;

    server_tokens off;
    # Images go straight to Supabase Storage; this only bounds form posts.
    client_max_body_size 10m;

    # Hashed build files: served from disk by nginx, cached by browsers for a year.
    location /_next/static/ {
        alias /srv/some/current/.next/static/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        gzip on;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    }

    location / {
        proxy_pass http://some_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwritten, never passed through: the rate limits (src/lib/rate-limit.ts) trust these.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pages stream in with Suspense; buffering would hold back the first paint.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
