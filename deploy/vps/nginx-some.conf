# Installed as /etc/nginx/sites-available/some (linked from sites-enabled), with the snippets
# nginx-some-app.conf (the app) and nginx-wp-<domain>.conf (WordPress) in /etc/nginx/snippets/.
# One Let's Encrypt certificate (certbot) covers all four names.

# Kept-open connections to the app, so each request skips a TCP handshake.
upstream some_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# WordPress logins: 6 tries a minute per address (used in nginx-wp-*.conf).
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=6r/m;

# Requests for the bare IP or any other host name get no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# aiproduktion.se: WordPress on its own paths, the app on everything else (client guide 261123).
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    http2 on;
    server_name aiproduktion.se www.aiproduktion.se;

    ssl_certificate /etc/letsencrypt/live/theirl.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theirl.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/some-app.conf;
    include snippets/wp-aiproduktion-se.conf;
}

# theirl.net: WordPress on its own paths, the app on everything else (client guide 261123).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name theirl.net www.theirl.net;

    ssl_certificate /etc/letsencrypt/live/theirl.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theirl.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/some-app.conf;
    include snippets/wp-theirl-net.conf;
}

# Plain http: straight to https.
server {
    listen 80;
    listen [::]:80;
    server_name theirl.net www.theirl.net aiproduktion.se www.aiproduktion.se;
    return 301 https://$host$request_uri;
}
